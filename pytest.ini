[pytest]
# Repo root on sys.path so tests import the product packages (lib, app, databricks_ops) directly.
pythonpath = .
# Only our fast/local suites. The e2e harness (tests/e2e) is run
# separately via its own runners (python run_all.py) — it needs two live workspaces, not pytest.
testpaths = tests/unit tests/integration
python_files = test_*.py
markers =
    integration: tests that need a local Postgres (spun up automatically; skipped if unavailable)
